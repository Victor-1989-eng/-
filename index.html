  <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pro_teleg.ua — Платформа Розумних Магазинів</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #248bcf;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #8e8e93;
            --tg-theme-secondary-bg-color: #f2f2f7;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0 0 80px 0;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }

        .platform-banner {
            width: 100%; height: 140px;
            background: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .platform-banner h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .platform-banner p { margin: 4px 0 0 0; font-size: 12px; opacity: 0.7; }

        .section-title { padding: 20px 15px 5px 15px; font-size: 16px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }

        .shop-list { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .shop-card {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 14px; padding: 16px; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer;
        }
        .shop-info { display: flex; align-items: center; gap: 14px; }
        .shop-emoji { font-size: 24px; background: white; padding: 6px 10px; border-radius: 10px; }
        .shop-name { font-size: 15px; font-weight: 600; }

        #main-store-container { display: none; padding: 12px; }
        .back-btn {
            background: none; border: none; color: var(--tg-theme-button-color);
            font-size: 14px; font-weight: 600; padding: 10px 0; display: flex; align-items: center; gap: 6px; cursor: pointer;
        }

        .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .product-card {
            background: var(--tg-theme-bg-color); border: 1px solid var(--tg-theme-secondary-bg-color);
            border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 13px; font-weight: 600; margin: 6px 0 2px 0; }
        .product-price { color: var(--tg-theme-button-color); font-weight: 700; font-size: 14px; margin-bottom: 6px; }

        /* Экран блокировки (Заморожен) */
        #frozen-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px; text-align: center;
        }
        .frozen-icon { font-size: 64px; color: #ff3b30; margin-bottom: 16px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: flex-end;
        }
        .modal-content {
            background: var(--tg-theme-bg-color); width: 100%; padding: 20px;
            border-top-left-radius: 20px; border-top-right-radius: 20px; box-sizing: border-box;
            max-height: 85%; overflow-y: auto;
        }
        
        .form-group { margin-bottom: 12px; position: relative; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: var(--tg-theme-hint-color); }
        .form-control {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--tg-theme-secondary-bg-color);
            background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color); box-sizing: border-box;
        }

        .suggestions-box {
            position: absolute; width: 100%; background: white; border: 1px solid #ccc;
            border-radius: 8px; max-height: 140px; overflow-y: auto; z-index: 1001; display: none;
        }
        .suggestion-item { padding: 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #eee; color: black; }

        .cart-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 12px;
            background: var(--tg-theme-bg-color); box-shadow: 0 -4px 10px rgba(0,0,0,0.04); box-sizing: border-box;
        }
        .btn-block {
            width: 100%; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color);
            border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВЫБОРА МАГАЗИНА -->
    <div id="shop-selection-screen">
        <div class="platform-banner">
            <h1>pro_teleg.ua</h1>
            <p>Платформа Автоматичних Магазинів</p>
        </div>
        <div class="section-title">Каталог верифікованих брендів:</div>
        <div class="shop-list" id="platform-shops-container"></div>
    </div>

    <!-- ЭКРАН ЗАМОРОЗКИ МАГАЗИНА -->
    <div id="frozen-screen">
        <div class="frozen-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h3>Магазин тимчасово не працює</h3>
        <p style="color: var(--tg-theme-hint-color); font-size: 14px;">Ця торгова точка тимчасово призупинила обслуговування клієнтів через технічний регламент платформи. Будь ласка, оберіть інший бренд.</p>
        <button class="btn-block" style="margin-top:20px;" onclick="goToPlatformHome()">Повернутися до каталогу</button>
    </div>

    <!-- ВИТРИНА МАГАЗИНА -->
    <div id="main-store-container">
        <button class="back-btn" onclick="goToPlatformHome()">
            <i class="fas fa-arrow-left"></i> На головну каталогу
        </button>
        <h2 id="current-shop-title" style="text-align: center; margin: 10px 0;"></h2>
        <div class="catalog" id="catalog-container"></div>
    </div>

    <div class="cart-footer" id="cart-block" style="display: none;">
        <button class="btn-block" onclick="openCheckoutModal()">🛒 Переглянути кошик (<span id="cart-count">0</span>)</button>
    </div>

    <!-- МОДАЛКА ЗАКАЗА -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <h3 style="margin-top:0; text-align:center;">📦 Оформлення доставки</h3>
            
            <div class="form-group">
                <label>ПІБ ОТРИМУВАЧА</label>
                <input type="text" id="order-name" class="form-control" placeholder="Прізвище Ім'я По батькові">
            </div>
            <div class="form-group">
                <label>КОНТАКТНИЙ ТЕЛЕФОН</label>
                <input type="tel" id="order-phone" class="form-control" value="+380">
            </div>
            <div class="form-group">
                <label>МІСТО (НОВА ПОШТА)</label>
                <input type="text" id="order-city" class="form-control" placeholder="Введіть назву міста..." autocomplete="off">
                <div class="suggestions-box" id="city-suggestions"></div>
            </div>
            <div class="form-group">
                <label>ВІДДІЛЕННЯ АБО ПОШТОМАТ</label>
                <input type="text" id="order-warehouse" class="form-control" placeholder="Оберіть номер відділення..." autocomplete="off" disabled>
                <div class="suggestions-box" id="warehouse-suggestions"></div>
            </div>
            <div class="form-group">
                <label>СПОСІБ ОПЛАТИ</label>
                <select id="order-payment" class="form-control">
                    <option value="Післяплата">Післяплата (при отриманні)</option>
                    <option value="Предоплата">Оплата на картку бренду</option>
                </select>
            </div>

            <button class="btn-block" id="btn-submit" style="margin-top: 10px;" onclick="submitOrder()">Надіслати на підтвердження</button>
            <button class="btn-block" style="background:none; color:red; margin-top:5px;" onclick="closeCheckoutModal()">Скасувати</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SPREADSHEET_ID = '10J9cWFta1wfNNxh2MQj0kZ5oetgxetJleVSLJ6qc3m8';
        const SERVER_URL = 'https://dukh-jqps.onrender.com'; // Твой адрес на Render
        
        let shopsMetadata = [];
        let currentShopId = ''; 
        let cart = [];
        let selectedCityRef = '';

        async function loadPlatformShops() {
            const container = document.getElementById('platform-shops-container');
            container.innerHTML = '<div style="text-align:center; color:gray; padding:20px;">Оновлення списку магазинів...</div>';
            try {
                // 1. Запрашиваем актуальные статусы (заморожен/активен) с нашего бэкенда
                const statusRes = await fetch(`${SERVER_URL}/get-shops-status`);
                shopsMetadata = await statusRes.json();

                container.innerHTML = '';
                shopsMetadata.forEach(shop => {
                    if(!shop.shop_id) return;
                    const card = document.createElement('div');
                    card.className = 'shop-card';
                    card.onclick = () => enterShop(shop);
                    card.innerHTML = `
                        <div class="shop-info">
                            <div class="shop-emoji">${shop.emoji || '🛍️'}</div>
                            <div class="shop-name">${shop.name} ${shop.status === 'frozen' ? '<span style="color:red; font-size:11px;">(Пауза)</span>' : ''}</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color:var(--tg-theme-hint-color);"></i>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<div style="text-align:center;color:red;">Помилка завантаження платформи.</div>';
            }
        }

        function enterShop(shop) {
            document.getElementById('shop-selection-screen').style.display = 'none';
            
            // ПРОВЕРКА ЗАМОРОЗКИ
            if(shop.status === 'frozen') {
                document.getElementById('frozen-screen').style.display = 'flex';
                return;
            }

            currentShopId = shop.shop_id;
            cart = [];
            updateCartButton();
            document.getElementById('main-store-container').style.display = 'block';
            document.getElementById('current-shop-title').innerText = shop.name;
            loadShopProducts(shop.sheet_name);
        }

        function goToPlatformHome() {
            document.getElementById('main-store-container').style.display = 'none';
            document.getElementById('frozen-screen').style.display = 'none';
            document.getElementById('cart-block').style.display = 'none';
            document.getElementById('shop-selection-screen').style.display = 'block';
            loadPlatformShops();
        }

        async function loadShopProducts(sheetName) {
    // Нам нужен чистый ID магазина, вырежем его из технического имени листа
    const sId = sheetName.replace('products_', '');
    const container = document.getElementById('catalog-container');
    container.innerHTML = '<div style="grid-column:1/3; text-align:center; color:gray; padding:20px;">Оновлення вітрини...</div>';
    try {
        const response = await fetch(`${SERVER_URL}/get-shop-products/${sId}`);
        const products = await response.json();
        container.innerHTML = '';

        if(products.length === 0) {
            container.innerHTML = '<div style="grid-column:1/3; text-align:center; color:gray;">Вітрина порожня.</div>';
            return;
        }

        products.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.name}">
                <div class="product-title">${item.name}</div>
                <div class="product-price">${item.price} грн</div>
                <button class="btn-block" style="padding:6px; font-size:12px;" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">Купити +</button>
            `;
            container.appendChild(card);
        });
    } catch (error) {
        container.innerHTML = '<div style="grid-column:1/3; text-align:center; color:gray;">Помилка завантаження товарів.</div>';
    }
}

                for(let i = 1; i < rows.length; i++) {
                    if(!rows[i][0]) continue;
                    const item = { id: rows[i][0], name: rows[i][1], category: rows[i][2], price: rows[i][3], img: rows[i][6] };

                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${item.img || 'https://via.placeholder.com/150'}" alt="${item.name}">
                        <div class="product-title">${item.name}</div>
                        <div class="product-price">${item.price} грн</div>
                        <button class="btn-block" style="padding:6px; font-size:12px;" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">Купити +</button>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                container.innerHTML = '<div style="grid-column:1/3; text-align:center; color:gray;">Вітрина порожня.</div>';
            }
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price, qty: 1 });
            updateCartButton();
        }

        function updateCartButton() {
            const block = document.getElementById('cart-block');
            if(cart.length > 0) {
                block.style.display = 'block';
                document.getElementById('cart-count').innerText = cart.length;
            } else {
                block.style.display = 'none';
            }
        }

        function openCheckoutModal() { document.getElementById('checkout-modal').style.display = 'flex'; }
        function closeCheckoutModal() { document.getElementById('checkout-modal').style.display = 'none'; }

        // --- ИНТЕГРАЦИЯ С НОВОЙ ПОЧТОЙ ---
        const cityInput = document.getElementById('order-city');
        const cityBox = document.getElementById('city-suggestions');
        const whInput = document.getElementById('order-warehouse');
        const whBox = document.getElementById('warehouse-suggestions');

        cityInput.addEventListener('input', async () => {
            const val = cityInput.value.trim();
            if(val.length < 2) { cityBox.style.display = 'none'; return; }
            const res = await fetch(`${SERVER_URL}/get-cities`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ cityName: val })
            });
            const cities = await res.json();
            if(cities.length > 0) {
                cityBox.innerHTML = '';
                cities.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = c.Description;
                    div.onclick = () => {
                        cityInput.value = c.Description;
                        selectedCityRef = c.Ref;
                        cityBox.style.display = 'none';
                        whInput.disabled = false;
                        whInput.value = '';
                        loadWarehouses('');
                    };
                    cityBox.appendChild(div);
                });
                cityBox.style.display = 'block';
            }
        });

        async function loadWarehouses(searchVal) {
            if(!selectedCityRef) return;
            const res = await fetch(`${SERVER_URL}/get-warehouses`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ cityRef: selectedCityRef })
            });
            const warehouses = await res.json();
            whBox.innerHTML = '';
            const filtered = warehouses.filter(w => w.Description.toLowerCase().includes(searchVal.toLowerCase()));
            filtered.slice(0, 30).forEach(w => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = w.Description;
                div.onclick = () => {
                    whInput.value = w.Description;
                    whBox.style.display = 'none';
                };
                whBox.appendChild(div);
            });
            whBox.style.display = 'block';
        }

        whInput.addEventListener('focus', () => loadWarehouses(''));
        whInput.addEventListener('input', () => loadWarehouses(whInput.value.trim()));

        async function submitOrder() {
            const name = document.getElementById('order-name').value.trim();
            const phone = document.getElementById('order-phone').value.trim();
            const city = cityInput.value.trim();
            const warehouse = whInput.value.trim();
            const payment = document.getElementById('order-payment').value;

            if(!name || phone.length < 10 || !city || !warehouse) {
                alert("Будь ласка, заповніть коректно всі поля форми доставки!");
                return;
            }

            document.getElementById('btn-submit').innerText = "Надсилання...";
            document.getElementById('btn-submit').disabled = true;

            const orderData = {
                cart: cart,
                delivery: { name, phone, city, warehouse, payment },
                initData: tg.initData,
                shop_id: currentShopId
            };

            try {
                const response = await fetch(`${SERVER_URL}/submit-order`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    alert("Замовлення надіслано на підтвердження власнику бренду! Дякуємо.");
                    cart = [];
                    updateCartButton();
                    tg.close();
                } else {
                    alert("Помилка надсилання. Можливо, магазин заблоковано.");
                }
            } catch (error) {
                alert("Помилка зв'язку з сервером платформи.");
            } finally {
                document.getElementById('btn-submit').innerText = "Надіслати на підтвердження";
                document.getElementById('btn-submit').disabled = false;
            }
        }

        window.onload = loadPlatformShops;
    </script>
</body>
</html>
