<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAROMA Parfum Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #1a222d;
            --tg-theme-text-color: #ffffff;
            --main-purple: #6a397a;
            --discount-red: #e04d2d;
            --hit-green: #73b53a;
            --card-bg: #242f3d;
            --border-color: #2f3e50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            margin: 0;
            padding: 0;
            color: var(--tg-theme-text-color);
            -webkit-user-select: none;
            padding-bottom: 80px; /* Запас под плавающую кнопку корзины */
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }

        .screen { display: none; padding: 16px; }
        .screen.active { display: block; }

        .category-list { display: flex; flex-direction: column; gap: 12px; }
        .category-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            font-size: 16px;
        }
        .category-item:active { transform: scale(0.98); }
        .category-item .icon { font-size: 22px; margin-right: 15px; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .product-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            position: relative;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-container { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
        .badge { color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .badge.hit { background: var(--hit-green); }
        .badge.discount { background: var(--discount-red); }
        
        .image-wrapper {
            background: #fff;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 140px;
        }
        .product-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-title { font-size: 13px; font-weight: 600; margin: 10px 0 4px 0; height: 34px; overflow: hidden; }
        
        .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
        .price-actual { color: #fff; font-weight: 700; font-size: 16px; }
        .price-old { color: #888; text-decoration: line-through; font-size: 12px; }
        
        .btn-action {
            background: var(--main-purple);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .back-btn { background: none; border: none; color: #aaa; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 16px; display: flex; align-items: center; }
        .detail-img-wrapper { background: #fff; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .detail-img { max-width: 100%; max-height: 240px; object-fit: contain; }
        .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .detail-desc { font-size: 14px; color: #aaa; line-height: 1.4; margin-bottom: 16px; white-space: pre-line; }
        
        .section-title { font-size: 14px; font-weight: 600; color: #888; margin: 16px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .volume-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .volume-badge {
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: var(--card-bg);
            color: #fff;
        }
        .volume-badge.selected {
            background: var(--main-purple);
            border-color: var(--main-purple);
        }

        .quantity-row { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .counter { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--card-bg); }
        .counter button { background: none; color: #fff; border: none; width: 40px; height: 40px; font-size: 20px; font-weight: 700; cursor: pointer; }
        .counter span { width: 40px; text-align: center; font-weight: 600; font-size: 16px; }

        /* Плавающий виджет корзины */
        .cart-widget {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: #73b53a;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            cursor: pointer;
            display: none;
            z-index: 10;
        }

        /* Экран Корзины */
        .cart-item {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            gap: 12px;
            align-items: center;
        }
        .cart-item-img { width: 60px; height: 60px; background: #fff; border-radius: 6px; padding: 4px; object-fit: contain; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .cart-item-meta { font-size: 12px; color: #aaa; margin-bottom: 6px; }
        .cart-item-price { font-weight: 700; color: #fff; font-size: 15px; }
        .cart-delete { color: #ff4a4a; font-weight: bold; cursor: pointer; padding: 10px; }

        .total-block {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="header-title">YAROMA PARFUM</span>
    </div>

    <div id="categories-screen" class="screen active">
        <div class="category-list">
            <div class="category-item" onclick="loadCategory('Женские')">
                <span class="icon">💃</span> Женские духи
            </div>
            <div class="category-item" onclick="loadCategory('Мужские')">
                <span class="icon">💼</span> Мужские духи
            </div>
            <div class="category-item" onclick="loadCategory('Унисекс')">
                <span class="icon">✨</span> Духи унисекс
            </div>
            <div class="category-item" onclick="loadCategory('Сеты')">
                <span class="icon">🎁</span> Парфюмерные наборы
            </div>
        </div>
    </div>

    <div id="products-screen" class="screen">
        <button class="back-btn" onclick="showScreen('categories-screen')">← Назад в меню</button>
        <div class="products-grid" id="grid-container"></div>
    </div>

    <div id="detail-screen" class="screen">
        <button class="back-btn" onclick="showScreen('products-screen')">← Назад к списку</button>
        <div class="detail-img-wrapper">
            <img class="detail-img" id="detail-img" src="" alt="">
        </div>
        <div class="detail-title" id="detail-title">Название</div>
        <div class="price-row">
            <span class="price-actual" id="detail-price">0 грн</span>
            <span class="price-old" id="detail-old-price">0 грн</span>
        </div>
        
        <div class="detail-desc" id="detail-desc">Описание...</div>

        <div class="section-title">Выбрать объём:</div>
        <div class="volume-group" id="volume-container"></div>

        <div class="section-title">Количество:</div>
        <div class="quantity-row">
            <div class="counter">
                <button onclick="changeQty(-1)">-</button>
                <span id="qty-val">1</span>
                <button onclick="changeQty(1)">+</button>
            </div>
        </div>

        <button class="btn-action" style="font-size: 16px; padding: 14px;" onclick="addToCart()">Добавить в корзину</button>
    </div>

    <div id="cart-screen" class="screen">
        <button class="back-btn" onclick="showScreen('categories-screen')">← Продолжить покупки</button>
        <div class="section-title" style="font-size: 18px; color: #fff; margin-bottom: 16px;">Ваш заказ:</div>
        <div id="cart-items-container"></div>
        
        <div class="total-block">
            <span>Итого к оплате:</span>
            <span id="cart-total-price">0 грн</span>
        </div>

        <button id="submit-order-btn" class="btn-action" style="font-size: 16px; padding: 16px; background: #73b53a;" onclick="sendOrder()">Оформить заказ</button>
    </div>

    <div id="cart-widget" class="cart-widget" onclick="showScreen('cart-screen')">
        <span id="widget-count">🛒 Корзина (0)</span>
        <span id="widget-total">0 грн</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        let allProducts = [];
        let currentProduct = null;
        let selectedVolume = 10; 
        let currentQty = 1;
        
        // Массив для хранения товаров в корзине
        let cart = [];

        async function fetchProducts() {
            try {
                const url = 'https://docs.google.com/spreadsheets/d/10J9cWFta1wfNNxh2MQj0kZ5oetgxetJleVSLJ6qc3m8/export?format=csv';
                const response = await fetch(url);
                const data = await response.text();
                const lines = data.replace(/\r/g, "").split('\n').slice(1);
                
                allProducts = lines.map(line => {
                    if (!line.trim()) return null;
                    const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (parts.length < 7) return null;
                    const price = parseInt(parts[3].replace(/"/g, '').trim()) || 0;
                    return {
                        id: parts[0].replace(/"/g, '').trim(),
                        name: parts[1].replace(/"/g, '').trim(),
                        category: parts[2].replace(/"/g, '').trim(),
                        price: price,
                        oldPrice: Math.round(price * 1.25),
                        description: parts[5].replace(/"/g, '').replace(/\\n/g, '\n').trim(),
                        image: parts[6].replace(/"/g, '').trim()
                    };
                }).filter(p => p !== null);

                showScreen('categories-screen');
            } catch (e) {
                console.error(e);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            // Скрываем или показываем плавающую плашку
            const widget = document.getElementById('cart-widget');
            if (cart.length > 0 && screenId !== 'cart-screen') {
                widget.style.display = 'flex';
            } else {
                widget.style.display = 'none';
            }

            if (screenId === 'cart-screen') renderCart();
        }

        function loadCategory(catName) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            const filtered = allProducts.filter(p => p.category.trim().toLowerCase() === catName.trim().toLowerCase());
            
            filtered.forEach(p => {
                container.innerHTML += `
                    <div class="product-card" onclick="openProduct('${p.id}')">
                        <div class="badge-container"><div class="badge hit">ХИТ</div></div>
                        <div class="image-wrapper"><img src="${p.image}"></div>
                        <div class="product-title">${p.name}</div>
                        <div class="price-row"><span class="price-actual">${p.price} грн</span></div>
                        <button class="btn-action">Выбрать</button>
                    </div>
                `;
            });
            showScreen('products-screen');
        }

        function openProduct(productId) {
            currentProduct = allProducts.find(p => p.id === productId);
            if (!currentProduct) return;

            document.getElementById('detail-img').src = currentProduct.image;
            document.getElementById('detail-title').innerText = currentProduct.name;
            document.getElementById('detail-desc').innerText = currentProduct.description;
            
            currentQty = 1;
            document.getElementById('qty-val').innerText = currentQty;
            
            const volContainer = document.getElementById('volume-container');
            volContainer.innerHTML = '';
            
            const isSet = currentProduct.category.toLowerCase().includes('сет');
            const volumes = isSet ? [3] : [6, 10, 20, 35, 55, 100];
            selectedVolume = volumes[0];
            
            volumes.forEach((v, idx) => {
                volContainer.innerHTML += `
                    <div class="volume-badge ${idx === 0 ? 'selected' : ''}" onclick="calculatePrice(this, ${v})">
                        ${isSet ? 'Сет из ' + v : v + ' мл'}
                    </div>
                `;
            });

            calculatePrice(null, selectedVolume);
            showScreen('detail-screen');
        }

        function calculatePrice(element, volume) {
            if (!currentProduct) return;
            if (element) {
                document.querySelectorAll('.volume-badge').forEach(b => b.classList.remove('selected'));
                element.classList.add('selected');
            }
            selectedVolume = volume;
            
            let basePrice = currentProduct.price;
            if (volume === 6) basePrice = Math.round(basePrice * 0.7);
            if (volume === 20) basePrice = Math.round(basePrice * 1.6);
            if (volume === 35) basePrice = Math.round(basePrice * 2.2);
            if (volume === 55) basePrice = Math.round(basePrice * 3.1);
            if (volume === 100) basePrice = Math.round(basePrice * 4.8);

            document.getElementById('detail-price').innerText = (basePrice * currentQty) + " грн";
            document.getElementById('detail-old-price').innerText = (Math.round(basePrice * 1.25) * currentQty) + " грн";
        }

        function changeQty(amount) {
            currentQty += amount;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qty-val').innerText = currentQty;
            calculatePrice(null, selectedVolume);
        }

        // ДОБАВЛЕНИЕ В КОРЗИНУ
        function addToCart() {
            const isSet = currentProduct.category.toLowerCase().includes('сет');
            const volText = isSet ? "Набор миниатюр" : selectedVolume + " мл";
            const currentItemPrice = parseInt(document.getElementById('detail-price').innerText);

            // Проверяем, есть ли уже такой товар с таким же объёмом
            const existing = cart.find(item => item.product_id === currentProduct.id && item.volume === volText);
            
            if (existing) {
                existing.qty += currentQty;
                existing.price += currentItemPrice;
            } else {
                cart.push({
                    product_id: currentProduct.id,
                    name: currentProduct.name,
                    image: currentProduct.image,
                    volume: volText,
                    qty: currentQty,
                    single_item_price: currentItemPrice / currentQty, // Цена за 1 шт выбранного объема
                    price: currentItemPrice
                });
            }

            updateWidget();
            showScreen('categories-screen');
        }

        function updateWidget() {
            const widget = document.getElementById('cart-widget');
            if (cart.length === 0) {
                widget.style.display = 'none';
                return;
            }
            
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            let totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            document.getElementById('widget-count').innerText = `🛒 Корзина (${totalQty})`;
            document.getElementById('widget-total').innerText = `${totalPrice} грн`;
            widget.style.display = 'flex';
        }

        // РЕНДЕР ЭКРАНА КОРЗИНЫ
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#aaa; padding:20px;">Ваша корзина пуста</div>`;
                document.getElementById('cart-total-price').innerText = "0 грн";
                document.getElementById('submit-order-btn').style.display = 'none';
                return;
            }

            document.getElementById('submit-order-btn').style.display = 'block';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="cart-item">
                        <img class="cart-item-img" src="${item.image}">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-meta">Объём: ${item.volume} | Кол-во: ${item.qty} шт.</div>
                            <div class="cart-item-price">${item.price} грн</div>
                        </div>
                        <div class="cart-delete" onclick="removeFromCart(${index})">❌</div>
                    </div>
                `;
            });

            document.getElementById('cart-total-price').innerText = total + " грн";
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateWidget();
        }

        // ОТПРАВКА ВСЕЙ КОРЗИНЫ НА СЕРВЕР
        function sendOrder() {
            const btn = document.getElementById('submit-order-btn');
            btn.innerText = "Отправка заказа...";
            btn.disabled = true;

            if (tg && tg.initData && tg.initData !== "") {
                const renderUrl = 'https://dukh-jqps.onrender.com/submit-order';
                
                fetch(renderUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        cart: cart // Передаем всю корзину целиком!
                    })
                })
                .then(res => {
                    if(res.ok) {
                        btn.innerText = "Успешно отправлено!";
                        cart = []; // Очищаем корзину после успеха
                        updateWidget();
                        setTimeout(() => { tg.close(); }, 1500);
                    } else {
                        alert("Ошибка сервера.");
                        btn.innerText = "Оформить заказ";
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    alert("Ошибка сети.");
                    btn.innerText = "Оформить заказ";
                    btn.disabled = false;
                });
            } else {
                alert("Имитация заказа вне ТГ: " + JSON.stringify(cart));
                btn.innerText = "Оформить заказ";
                btn.disabled = false;
            }
        }

        fetchProducts();
    </script>
</body>
</html>
